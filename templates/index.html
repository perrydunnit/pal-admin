<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Palworld Admin — Admin</title>
<style>
  :root {
    --bg: #0f1116; --panel: #171a21; --panel-2: #1d2129; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a4; --accent: #5b9dff; --good: #3ddc84;
    --p1: #5b9dff; --p2: #ff7ab6; --p3: #3ddc84; --p4: #ffb454; --p5: #b98cff; --p6: #4fd1c5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.off { background: #4a5162; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .card .v { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .v small { font-size: 13px; color: var(--muted); font-weight: 400; }

  section { margin-bottom: 26px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

  table { width: 100%; border-collapse: collapse; }
  #live table, #players table { min-width: 620px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--panel-2); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: #232833; color: var(--muted); border: 1px solid var(--line); }
  .bar { height: 6px; border-radius: 999px; background: #232833; overflow: hidden; min-width: 60px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .cal-head .label { font-weight: 600; }
  .cal-head button { background: #232833; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
  .cal-head button:hover { border-color: var(--accent); }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .dow span { padding: 7px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cell { min-height: 92px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px 8px; cursor: pointer; position: relative; transition: background .12s; }
  .cell:nth-child(7n) { border-right: none; }
  .cell.blank { background: #12141a; cursor: default; }
  .cell:hover:not(.blank) { background: #1b1f27; }
  .cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; background: #1b212b; }
  .cell .d { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .cell.today .d { color: var(--accent); font-weight: 700; }
  .chips { display: flex; flex-direction: column; gap: 3px; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--accent); background: #1e232c; }
  .cell .tot { position: absolute; right: 8px; top: 6px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .empty { color: var(--muted); font-size: 13px; padding: 16px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Palworld Admin</h1>
    <span class="sub" id="sub">loading…</span>
  </header>

  <div class="cards" id="cards"></div>

  <section>
    <h2>Online now</h2>
    <div class="panel" id="live"></div>
  </section>

  <section>
    <h2>Player stats</h2>
    <div class="panel" id="players"></div>
  </section>

  <section>
    <h2>Who was online</h2>
    <div class="panel">
      <div class="cal-head">
        <button id="prev">‹</button>
        <span class="label" id="calLabel"></span>
        <button id="next">›</button>
      </div>
      <div class="dow">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
const COLORS = ["--p1", "--p2", "--p3", "--p4", "--p5", "--p6"];
const state = { data: null, month: null, selected: null, calDigest: null, cellJson: {}, loading: false };

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorFor = pid => {
  let h = 0;
  for (const ch of String(pid)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return css(COLORS[h % COLORS.length]);
};

const hms = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m`;
  return `${s}s`;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clock = iso => new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

function renderChrome() {
  const d = state.data, P = d.players;
  const live = P.filter(p => p.online);
  const totalSecs = P.reduce((a, p) => a + p.total_seconds, 0);
  document.getElementById('sub').innerHTML =
    `<span class="dot ${live.length ? 'on' : 'off'}"></span> ${live.length} online · ${P.length} players · world day ${d.metrics?.days ?? '—'}`;

  document.getElementById('cards').innerHTML = [
    ['Online', live.length, `${P.length} known`],
    ['Server FPS', d.metrics?.fps != null ? Math.round(d.metrics.fps) : '—', ''],
    ['World day', d.metrics?.days ?? '—', ''],
    ['Base camps', d.metrics?.basecamps ?? '—', ''],
    ['Total playtime', hms(totalSecs), 'all players'],
    ['Sessions', P.reduce((a, p) => a + p.sessions, 0), 'tracked'],
  ].map(([k, v, s]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}${s ? ` <small>${s}</small>` : ''}</div></div>`).join('');

  document.getElementById('live').innerHTML = live.length ? `<table>
    <tr><th>Player</th><th>Platform</th><th class="num">Level</th><th>Online for</th><th class="num">Ping</th></tr>
    ${live.map(p => `<tr>
      <td><span class="dot on"></span> ${esc(p.name)}</td>
      <td><span class="pill">${esc(p.platform)}</span></td>
      <td class="num">${p.level ?? '—'}</td>
      <td>${p.session_started ? hms((Date.now() - new Date(p.session_started)) / 1000) : '—'}</td>
      <td class="num">${esc(p.ip || '—')}</td>
    </tr>`).join('')}</table>` : `<div class="empty">Nobody online right now.</div>`;

  const max = Math.max(1, ...P.map(p => p.total_seconds));
  document.getElementById('players').innerHTML = P.length ? `<table>
    <tr><th>Player</th><th>Platform</th><th class="num">Level</th><th class="num">Playtime</th><th>Sessions</th><th class="num">Avg session</th><th class="num">Last seen</th></tr>
    ${P.map(p => `<tr>
      <td><span class="dot ${p.online ? 'on' : 'off'}"></span> ${esc(p.name)}</td>
      <td><span class="pill">${esc(p.platform)}</span></td>
      <td class="num">${p.level ?? '—'}</td>
      <td class="num">${hms(p.total_seconds)}<div class="bar"><i style="width:${Math.round(100 * p.total_seconds / max)}%"></i></div></td>
      <td class="num">${p.sessions}</td>
      <td class="num">${p.sessions ? hms(p.avg_seconds) : '—'}</td>
      <td class="num">${p.last_seen ? clock(p.last_seen) : '—'}</td>
    </tr>`).join('')}</table>` : `<div class="empty">No players recorded yet.</div>`;
}

function cellInner(day) {
  const chips = day.players.slice(0, 3).map(p =>
    `<span class="chip" style="border-left-color:${colorFor(p.player_id)}">${esc(p.name)} · ${hms(p.seconds)}</span>`
  ).join('');
  const more = day.players.length > 3
    ? `<span class="chip" style="border-left-color:#3a4150;color:#8b93a4">+${day.players.length - 3} more</span>` : '';
  return `<div class="d">${Number(day.date.slice(-2))}</div>
    ${day.total ? `<span class="tot">${hms(day.total)}</span>` : ''}
    <div class="chips">${chips}${more}</div>`;
}

function renderCalendar() {
  const d = state.data;
  document.getElementById('calLabel').textContent =
    new Date(d.month + '-01T00:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  const [y, m] = d.month.split('-').map(Number);
  const firstDow = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push('<div class="cell blank"></div>');

  state.cellJson = {};
  for (const day of d.days) {
    const cls = ['cell'];
    if (day.date === d.today) cls.push('today');
    if (day.total) cls.push('has');
    if (day.date === state.selected) cls.push('sel');
    state.cellJson[day.date] = JSON.stringify(day);
    cells.push(`<div class="${cls.join(' ')}" data-date="${day.date}">${cellInner(day)}</div>`);
  }
  document.getElementById('grid').innerHTML = cells.join('');
}

/** Refresh only cells whose data changed, so a live session does not rebuild the grid. */
function updateCells(days) {
  const grid = document.getElementById('grid');
  for (const day of days) {
    const json = JSON.stringify(day);
    if (state.cellJson[day.date] === json) continue;
    state.cellJson[day.date] = json;
    const el = grid.querySelector(`.cell[data-date="${day.date}"]`);
    if (!el) continue;
    el.innerHTML = cellInner(day);
    el.classList.toggle('has', !!day.total);
  }
}

function setActive(date) {
  state.selected = date;
  document.querySelectorAll('.cell[data-date]').forEach(c =>
    c.classList.toggle('sel', c.dataset.date === date));
}

document.getElementById('grid').addEventListener('click', e => {
  const cell = e.target.closest('.cell[data-date]');
  if (cell) setActive(cell.dataset.date);
});

async function load(month) {
  if (state.loading) return;
  state.loading = true;
  try {
    const q = month ? `?month=${encodeURIComponent(month)}` : '';
    const summary = await (await fetch('/api/summary' + q)).json();
    state.data = summary;
    state.month = summary.month;

    renderChrome();

    if (state.calDigest !== summary.month) {
      state.calDigest = summary.month;
      renderCalendar();
    } else {
      updateCells(summary.days);
    }

    document.getElementById('foot').textContent =
      `Auto-refreshes every 30s · last update ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    console.error('refresh failed', err);
  } finally {
    state.loading = false;
  }
}

document.getElementById('prev').onclick = () => {
  const [y, m] = state.month.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  load(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
};
document.getElementById('next').onclick = () => {
  const [y, m] = state.month.split('-').map(Number);
  const d = new Date(y, m, 1);
  load(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
};

load();
setInterval(() => load(state.month), 30000);
</script>
</body>
</html>
