<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Palworld Admin — Admin</title>
<style>
  :root {
    --bg: #0f1116;
    --panel: #171a21;
    --panel-2: #1d2129;
    --line: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a4;
    --accent: #5b9dff;
    --good: #3ddc84;
    --warn: #ffb454;
    --p1: #5b9dff; --p2: #ff7ab6; --p3: #3ddc84; --p4: #ffb454;
    --p5: #b98cff; --p6: #4fd1c5;
    --leftw: 132px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.off { background: #4a5162; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .card .v { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .v small { font-size: 13px; color: var(--muted); font-weight: 400; }

  section { margin-bottom: 26px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .panel.x { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; }
  #live table, #players table { min-width: 620px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--panel-2); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: #232833; color: var(--muted); border: 1px solid var(--line); }
  .bar { height: 6px; border-radius: 999px; background: #232833; overflow: hidden; min-width: 60px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .cal-head .label { font-weight: 600; }
  .cal-head button { background: #232833; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
  .cal-head button:hover { border-color: var(--accent); }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .dow span { padding: 7px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cell { min-height: 92px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px 8px; cursor: pointer; position: relative; transition: background .12s; }
  .cell:nth-child(7n) { border-right: none; }
  .cell.blank { background: #12141a; cursor: default; }
  .cell:hover:not(.blank) { background: #1b1f27; }
  .cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; background: #1b212b; }
  .cell .d { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .cell.today .d { color: var(--accent); font-weight: 700; }
  .chips { display: flex; flex-direction: column; gap: 3px; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--accent); background: #1e232c; }
  .cell .tot { position: absolute; right: 8px; top: 6px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- continuous timeline ---------- */
  .tlx { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: #333a47 #12141a; }
  .tlx::-webkit-scrollbar { height: 10px; }
  .tlx::-webkit-scrollbar-track { background: #12141a; }
  .tlx::-webkit-scrollbar-thumb { background: #333a47; border-radius: 5px; }
  .tlx::-webkit-scrollbar-thumb:hover { background: #454e5f; }

  .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .detail-head h2 { margin: 0; }
  .zoom { color: var(--muted); font-size: 12px; }
  .zoom[open] { display: flex; align-items: center; gap: 8px; }
  .zoom summary { cursor: pointer; font-size: 11px; }
  .zoom summary:hover { color: var(--text); }
  .zoom summary:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  .zoom-controls { display: none; align-items: center; gap: 8px; }
  .zoom[open] .zoom-controls { display: flex; }
  .zoom button { width: 30px; height: 30px; padding: 0; background: #232833; color: var(--text); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 18px; line-height: 1; }
  .zoom button:hover:not(:disabled) { border-color: var(--accent); }
  .zoom button:disabled { opacity: .45; cursor: default; }
  .zoom input { width: 110px; accent-color: var(--accent); }
  .zoom output { min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }

  .tlx-inner { position: relative; width: max-content; min-width: 100%; }

  .tl-row { display: flex; align-items: stretch; position: relative; z-index: 2; height: 34px; width: 100%; }
  .tl-row.head { height: 28px; }

  .tl-left {
    position: sticky; left: 0; z-index: 5;
    flex: 0 0 var(--leftw); width: var(--leftw);
    display: flex; align-items: center; gap: 7px;
    padding: 0 10px; font-size: 12px;
    background: var(--panel); border-right: 1px solid var(--line);
    overflow: hidden;
  }
  .tl-left b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-left .plat { color: var(--muted); font-size: 10px; }
  .tl-left .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tl-row.head .tl-left {
    background: var(--panel-2); border-bottom: 1px solid var(--line);
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .tl-row.head .tl-left.is-today { color: var(--accent); }

  .tl-track { position: relative; flex: 0 0 auto; }
  .tl-row.head .tl-track { border-bottom: 1px solid var(--line); background: var(--panel-2); }

  .overlay { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 1; }
  .dayline { position: absolute; top: 0; bottom: 0; width: 1px; background: #333a47; }
  .noonline { position: absolute; top: 0; bottom: 0; width: 1px; background: #20242c; }
  .nowline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--good); opacity: .5; }

  .daylabel {
    position: absolute; top: 5px; font-size: 10px; letter-spacing: .02em;
    color: var(--muted); white-space: nowrap; padding-left: 5px;
    border-left: 1px solid #3d4452;
  }
  .daylabel.today { color: var(--accent); font-weight: 600; }

  .seg {
    position: absolute; top: 6px; height: 20px; border-radius: 4px; min-width: 3px;
    background: var(--c); opacity: .9; cursor: help;
    -webkit-mask-image: var(--mask, none); mask-image: var(--mask, none);
    transition: opacity .12s, filter .12s;
  }
  .seg:hover { opacity: 1; filter: brightness(1.25); outline: 1px solid rgba(255,255,255,.35); }
  .seg.open {
    background: linear-gradient(90deg, var(--c) 0%, var(--c) 62%, transparent 100%);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .95; } 50% { opacity: .55; } }
  .seg.open::after {
    content: ""; position: absolute; right: 2px; top: 50%; width: 4px; height: 4px;
    margin-top: -2px; border-radius: 50%; background: var(--good);
  }

  .tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0;
    width: max-content; max-width: 320px;
    background: #0b0d12; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; line-height: 1.5;
    box-shadow: 0 8px 24px rgba(0,0,0,.55); transition: opacity .1s; transform: translate(-50%, -100%);
  }
  .tip.on { opacity: 1; }
  .tip b { display: block; margin-bottom: 3px; }
  .tip .row { color: var(--muted); }
  .tip .note { color: var(--warn); margin-top: 3px; }

  .empty { color: var(--muted); font-size: 13px; padding: 16px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 24px; }

  @media (max-width: 700px) {
    :root { --leftw: 96px; }
    .wrap { padding: 16px 12px 40px; }
    .card .v { font-size: 20px; }
    .cell { min-height: 62px; padding: 5px 6px; }
    .cell .tot, .cell .chip { display: none; }
    .cell.has { background: rgba(91,157,255,.10); }
    .cell.has:hover { background: rgba(91,157,255,.18); }
    .cal-head .label { font-size: 14px; }
    .tl-left { font-size: 11px; padding: 0 7px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Palworld Admin</h1>
    <span class="sub" id="sub">loading…</span>
  </header>

  <div class="cards" id="cards"></div>

  <section>
    <h2>Online now</h2>
    <div class="panel x" id="live"></div>
  </section>

  <section>
    <h2>Player stats</h2>
    <div class="panel x" id="players"></div>
  </section>

  <section>
    <h2>Who was online</h2>
    <div class="panel">
      <div class="cal-head">
        <button id="prev">‹</button>
        <span class="label" id="calLabel"></span>
        <button id="next">›</button>
      </div>
      <div class="dow">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section>
    <div class="detail-head">
      <h2 id="detailHead">Day detail</h2>
      <details class="zoom" aria-label="Timeline zoom">
        <summary id="zoomSummary" title="Adjust timeline zoom">100%</summary>
        <div class="zoom-controls">
          <button id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out">−</button>
          <input id="zoomRange" type="range" min="50" max="300" step="25" value="100" aria-label="Zoom level" />
          <output id="zoomValue" for="zoomRange">100%</output>
          <button id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
        </div>
      </details>
    </div>
    <div class="panel">
      <div class="tlx" id="tlx">
        <div class="tlx-inner" id="tlxInner"></div>
      </div>
    </div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
const COLORS = ["--p1", "--p2", "--p3", "--p4", "--p5", "--p6"];
const tlx = document.getElementById('tlx');
const tlxInner = document.getElementById('tlxInner');

const state = {
  data: null,
  month: null,
  selected: null,
  timeline: null,
  dayWidth: 0,
  zoom: 1,
  tlDigest: null,
  calDigest: null,
  cellJson: {},
  loading: false,
  scrollTimer: null,
};

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorFor = pid => {
  let h = 0;
  for (const ch of String(pid)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return css(COLORS[h % COLORS.length]);
};
const hms = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m`;
  return `${s}s`;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtFull = iso => new Date(iso).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const dayShort = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const dayLong = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const clock = iso => new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

// ------------------------------------------------------------ chrome

function renderChrome() {
  const d = state.data, P = d.players;
  const live = P.filter(p => p.online);
  const totalSecs = P.reduce((a, p) => a + p.total_seconds, 0);
  document.getElementById('sub').innerHTML =
    `<span class="dot ${live.length ? 'on' : 'off'}"></span> ${live.length} online · ${P.length} players · world day ${d.metrics?.days ?? '—'}`;

  document.getElementById('cards').innerHTML = [
    ['Online', live.length, `${P.length} known`],
    ['Server FPS', d.metrics?.fps != null ? Math.round(d.metrics.fps) : '—', ''],
    ['World day', d.metrics?.days ?? '—', ''],
    ['Base camps', d.metrics?.basecamps ?? '—', ''],
    ['Total playtime', hms(totalSecs), 'all players'],
    ['Sessions', P.reduce((a, p) => a + p.sessions, 0), 'tracked'],
  ].map(([k, v, s]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}${s ? ` <small>${s}</small>` : ''}</div></div>`).join('');

  document.getElementById('live').innerHTML = live.length ? `<table>
    <tr><th>Player</th><th>Platform</th><th class="num">Level</th><th>Online for</th><th class="num">Ping</th></tr>
    ${live.map(p => `<tr>
      <td><span class="dot on"></span> ${esc(p.name)}</td>
      <td><span class="pill">${esc(p.platform)}</span></td>
      <td class="num">${p.level ?? '—'}</td>
      <td>${p.session_started ? hms((Date.now() - new Date(p.session_started)) / 1000) : '—'}</td>
      <td class="num">${esc(p.ip || '—')}</td>
    </tr>`).join('')}</table>` : `<div class="empty">Nobody online right now.</div>`;

  const max = Math.max(1, ...P.map(p => p.total_seconds));
  document.getElementById('players').innerHTML = P.length ? `<table>
    <tr><th>Player</th><th>Platform</th><th class="num">Level</th><th class="num">Playtime</th><th>Sessions</th><th class="num">Avg session</th><th class="num">Last seen</th></tr>
    ${P.map(p => `<tr>
      <td><span class="dot ${p.online ? 'on' : 'off'}"></span> ${esc(p.name)}</td>
      <td><span class="pill">${esc(p.platform)}</span></td>
      <td class="num">${p.level ?? '—'}</td>
      <td class="num">${hms(p.total_seconds)}<div class="bar"><i style="width:${Math.round(100 * p.total_seconds / max)}%"></i></div></td>
      <td class="num">${p.sessions}</td>
      <td class="num">${p.sessions ? hms(p.avg_seconds) : '—'}</td>
      <td class="num">${p.last_seen ? clock(p.last_seen) : '—'}</td>
    </tr>`).join('')}</table>` : `<div class="empty">No players recorded yet.</div>`;
}

function cellInner(day) {
  const chips = day.players.slice(0, 3).map(p =>
    `<span class="chip" style="border-left-color:${colorFor(p.player_id)}">${esc(p.name)} · ${hms(p.seconds)}</span>`
  ).join('');
  const more = day.players.length > 3
    ? `<span class="chip" style="border-left-color:#3a4150;color:#8b93a4">+${day.players.length - 3} more</span>` : '';
  return `<div class="d">${Number(day.date.slice(-2))}</div>
    ${day.total ? `<span class="tot">${hms(day.total)}</span>` : ''}
    <div class="chips">${chips}${more}</div>`;
}

function renderCalendar() {
  const d = state.data;
  document.getElementById('calLabel').textContent =
    new Date(d.month + '-01T00:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  const [y, m] = d.month.split('-').map(Number);
  const firstDow = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push('<div class="cell blank"></div>');

  state.cellJson = {};
  for (const day of d.days) {
    const cls = ['cell'];
    if (day.date === d.today) cls.push('today');
    if (day.total) cls.push('has');
    if (day.date === state.selected) cls.push('sel');
    state.cellJson[day.date] = JSON.stringify(day);
    cells.push(`<div class="${cls.join(' ')}" data-date="${day.date}">${cellInner(day)}</div>`);
  }
  document.getElementById('grid').innerHTML = cells.join('');
}

function updateCells(days) {
  const grid = document.getElementById('grid');
  for (const day of days) {
    const json = JSON.stringify(day);
    if (state.cellJson[day.date] === json) continue;
    state.cellJson[day.date] = json;
    const el = grid.querySelector(`.cell[data-date="${day.date}"]`);
    if (!el) continue;
    el.innerHTML = cellInner(day);
    el.classList.toggle('has', !!day.total);
  }
}

document.getElementById('grid').addEventListener('click', e => {
  const cell = e.target.closest('.cell[data-date]');
  if (cell) focusDay(cell.dataset.date, true);
});

// ------------------------------------------------------------ timeline

function dayWidthFor() {
  const leftWidth = parseFloat(css('--leftw')) || 0;
  return Math.max(1, tlx.clientWidth - leftWidth) * state.zoom;
}

function setZoom(value) {
  state.zoom = Math.max(0.5, Math.min(3, value));
  state.dayWidth = dayWidthFor();
  const zoomLabel = `${Math.round(state.zoom * 100)}%`;
  document.getElementById('zoomRange').value = String(Math.round(state.zoom * 100));
  document.getElementById('zoomValue').value = zoomLabel;
  document.getElementById('zoomSummary').textContent = zoomLabel;
  document.getElementById('zoomOut').disabled = state.zoom <= 0.5;
  document.getElementById('zoomIn').disabled = state.zoom >= 3;
  const keep = state.selected;
  renderTimeline();
  if (keep) focusDay(keep, false);
}

function paneWidths() {
  const tl = state.timeline;
  const W = tl.days.length * state.dayWidth;
  return { W, xs: tl.days.map(d => d.start_frac * W) };
}

function renderTimeline() {
  const tl = state.timeline;
  if (!tl) return;
  const { W, xs } = paneWidths();
  const today = state.data.today;

  const players = [...new Set(tl.sessions.map(s => s.player_id))];

  let overlay = '';
  tl.days.forEach((d, i) => {
    if (i > 0) overlay += `<div class="dayline" style="left:${xs[i]}px"></div>`;
    overlay += `<div class="noonline" style="left:${d.mid_frac * W}px"></div>`;
  });
  if (tl.now_frac != null) overlay += `<div class="nowline" style="left:${tl.now_frac * W}px"></div>`;

  const labels = tl.days.map((d, i) =>
    `<span class="daylabel${d.date === today ? ' today' : ''}" style="left:${xs[i]}px">${dayShort(d.date)}</span>`
  ).join('');

  const rows = players.map(pid => {
    const list = tl.sessions.filter(s => s.player_id === pid);
    const bars = list.map(s => {
      const left = s.start_frac * W;
      const width = Math.max(3, (s.end_frac - s.start_frac) * W);
      const cls = ['seg'];
      if (s.ongoing) cls.push('open');
      let mask = 'none';
      if (s.continues_before && (s.continues_after || s.ongoing)) {
        mask = 'linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%)';
      } else if (s.continues_before) {
        mask = 'linear-gradient(90deg, transparent 0, #000 16px)';
      } else if (s.continues_after) {
        mask = 'linear-gradient(90deg, #000 calc(100% - 16px), transparent 100%)';
      }
      return `<i class="${cls.join(' ')}" style="left:${left}px;width:${width}px;--c:${colorFor(pid)};--mask:${mask}"
        data-tip="${esc(tipFor(s))}"></i>`;
    }).join('');
    const first = list[0];
    return `<div class="tl-row" data-player="${esc(pid)}">
      <div class="tl-left">
        <span class="swatch" style="background:${colorFor(pid)}"></span>
        <b>${esc(first.name)}</b><span class="plat">${esc(first.platform || '')}</span>
      </div>
      <div class="tl-track" style="width:${W}px">${bars}</div>
    </div>`;
  }).join('');

  const emptyRow = players.length ? '' :
    `<div class="tl-row"><div class="tl-left"><span class="plat">no data</span></div>
      <div class="tl-track" style="width:${W}px"></div></div>`;

  tlxInner.innerHTML = `
    <div class="overlay" style="left:var(--leftw);width:${W}px">${overlay}</div>
    <div class="tl-row head">
      <div class="tl-left" id="stickDate">—</div>
      <div class="tl-track" style="width:${W}px">${labels}</div>
    </div>
    ${rows}${emptyRow}`;

  bindBars();
  syncSticky();
}

function bindBars() {
  tlxInner.querySelectorAll('.seg').forEach(s => {
    s.addEventListener('mouseenter', e => showTip(e, s.dataset.tip));
    s.addEventListener('mousemove', moveTip);
    s.addEventListener('mouseleave', hideTip);
  });
}

function dayIndexAt(x) {
  const { xs } = paneWidths();
  let idx = 0;
  for (let i = 0; i < xs.length; i++) if (xs[i] <= x + 0.5) idx = i;
  return idx;
}

function syncSticky() {
  const tl = state.timeline;
  if (!tl) return;
  const idx = dayIndexAt(tlx.scrollLeft);
  const day = tl.days[idx];
  if (!day) return;

  const cell = document.getElementById('stickDate');
  if (cell) {
    cell.textContent = dayLong(day.date);
    cell.classList.toggle('is-today', day.date === state.data.today);
  }
  if (state.selected !== day.date) {
    state.selected = day.date;
    document.querySelectorAll('.cell[data-date]').forEach(c =>
      c.classList.toggle('sel', c.dataset.date === day.date));
  }
}

function focusDay(date, animate) {
  const tl = state.timeline;
  if (!tl) return;
  const idx = tl.days.findIndex(d => d.date === date);
  if (idx < 0) return;
  const { xs } = paneWidths();
  tlx.scrollTo({ left: xs[idx], behavior: animate ? 'smooth' : 'auto' });
}

tlx.addEventListener('scroll', () => {
  syncSticky();
  clearTimeout(state.scrollTimer);
  state.scrollTimer = setTimeout(syncSticky, 120);
}, { passive: true });

document.getElementById('zoomRange').addEventListener('input', e => {
  setZoom(Number(e.target.value) / 100);
});
document.getElementById('zoomOut').addEventListener('click', () => setZoom(state.zoom - 0.25));
document.getElementById('zoomIn').addEventListener('click', () => setZoom(state.zoom + 0.25));

// ------------------------------------------------------------ tooltip

const tipEl = document.createElement('div');
tipEl.className = 'tip';
document.body.appendChild(tipEl);

function tipFor(s) {
  const parts = [`${s.name}${s.platform ? ' · ' + s.platform : ''}`];
  parts.push(`start ${fmtFull(s.start)}`);
  parts.push(s.ongoing ? `still online · ${hms(s.duration_seconds)} so far` : `end ${fmtFull(s.end)}`);
  if (!s.ongoing) parts.push(`duration ${hms(s.duration_seconds)}`);
  if (s.continues_before) parts.push('continued from the previous month');
  if (s.continues_after && !s.ongoing) parts.push('continues into the next month');
  return parts.join('\u0001');
}

function showTip(e, text) {
  const [title, ...rows] = text.split('\u0001');
  tipEl.innerHTML = `<b>${esc(title)}</b>` +
    rows.map((r, i) => `<div class="row${i > 1 && /continued|continues/.test(r) ? ' note' : ''}">${esc(r)}</div>`).join('');
  tipEl.classList.add('on');
  moveTip(e);
}
function moveTip(e) {
  const pad = 10, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const x = Math.min(Math.max(e.clientX, w / 2 + pad), window.innerWidth - w / 2 - pad);
  if (e.clientY - h - 14 < pad) {
    tipEl.style.top = `${e.clientY + 18}px`;
    tipEl.style.transform = 'translate(-50%, 0)';
  } else {
    tipEl.style.top = `${e.clientY - 14}px`;
    tipEl.style.transform = 'translate(-50%, -100%)';
  }
  tipEl.style.left = `${x}px`;
}
function hideTip() { tipEl.classList.remove('on'); }

// ------------------------------------------------------------ load / refresh

async function load(month) {
  if (state.loading) return;
  state.loading = true;
  try {
    const q = month ? `?month=${encodeURIComponent(month)}` : '';
    const summary = await (await fetch('/api/summary' + q)).json();
    const timeline = await (await fetch('/api/timeline?month=' + summary.month)).json();

    const monthChanged = state.month !== summary.month;
    state.data = summary;
    state.month = summary.month;
    state.timeline = timeline;
    state.dayWidth = dayWidthFor();

    renderChrome();

    if (state.calDigest !== summary.month) {
      state.calDigest = summary.month;
      renderCalendar();
    } else {
      updateCells(summary.days);
    }

    const digest = JSON.stringify({ d: timeline.days, s: timeline.sessions });
    const keepLeft = monthChanged ? null : tlx.scrollLeft;
    if (digest !== state.tlDigest || monthChanged) {
      state.tlDigest = digest;
      renderTimeline();
      if (keepLeft != null) tlx.scrollLeft = keepLeft;
      else focusDay(pickStartDay(timeline), false);
      syncSticky();
    } else if (timeline.now_frac != null) {
      // live marker only
      const line = tlxInner.querySelector('.nowline');
      const { W } = paneWidths();
      if (line) line.style.left = `${timeline.now_frac * W}px`;
      else { renderTimeline(); tlx.scrollLeft = keepLeft ?? 0; }
    }

    document.getElementById('detailHead').textContent = `Day detail — ${timeline.month_label}`;
    document.getElementById('foot').textContent =
      `Auto-refreshes every 30s · last update ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    console.error('refresh failed', err);
  } finally {
    state.loading = false;
  }
}

function pickStartDay(timeline) {
  const today = state.data.today;
  if (timeline.days.some(d => d.date === today)) return today;
  const withData = state.data.days.find(d => d.total);
  return withData ? withData.date : timeline.days[0].date;
}

document.getElementById('prev').onclick = () => {
  const [y, m] = state.month.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  load(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
};
document.getElementById('next').onclick = () => {
  const [y, m] = state.month.split('-').map(Number);
  const d = new Date(y, m, 1);
  load(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
};

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = dayWidthFor();
    if (Math.abs(w - state.dayWidth) < 1) return;
    const keep = state.selected;
    state.dayWidth = w;
    state.tlDigest = null;
    renderTimeline();
    if (keep) focusDay(keep, false);
  }, 150);
});

load();
setInterval(() => load(state.month), 30000);
</script>
</body>
